name: Review Team

# A team of role-based Claude reviewers (QA, Financial Strategy, Trader,
# Project Manager) reviews every pull request and posts one combined comment.
# Advisory only — it never blocks a merge. Requires the repo secret
# ANTHROPIC_API_KEY; without it the job runs and exits cleanly with a notice.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: review-team-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review-team:
    # Skip draft PRs — review them once they're marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need base history to compute the PR diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install anthropic SDK
        run: python -m pip install --upgrade "anthropic>=0.49"

      - name: Run review team
        continue-on-error: true  # advisory: never fail the PR on a review hiccup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Passed via env (not the shell) so PR text can't inject commands.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          # Cost/quality levers — override as repo variables if desired:
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-opus-5' }}
          REVIEW_EFFORT: ${{ vars.REVIEW_EFFORT || 'high' }}
        run: python scripts/review_team.py
